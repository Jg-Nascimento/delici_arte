<style>
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: 'Montserrat', sans-serif;
  background-color: #ff8ca3;
  background-image: radial-gradient(#ffffff 20%, transparent 20%);
  background-size: 18px 18px;
}
.brand-font { font-family: 'Great Vibes', cursive; }
.glass {
  background: rgba(255, 245, 247, 0.96);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-right: 2px solid rgba(229, 168, 35, 0.4);
}
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.btn-option { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; user-select: none; }
.btn-option:active { transform: scale(0.96); }
.loader {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: #8C6239;
  font-size: 14px;
  z-index: 20;
  transition: opacity 0.5s;
}
.loader-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin: 0 3px;
  border-radius: 50%;
  background: #D9A05B;
  animation: bounce 1.4s infinite ease-in-out both;
}
.loader-dot:nth-child(1) { animation-delay: -0.32s; }
.loader-dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}
#canvas-container canvas { display: block; width: 100% !important; height: 100% !important; }
.btn-active {
  border-color: #e5a823 !important;
  background-color: #fffdf5 !important;
  box-shadow: 0 0 0 3px rgba(229, 168, 35, 0.35);
}
.cake-thumb {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 -4px 6px rgba(0,0,0,0.15), 0 4px 8px rgba(0,0,0,0.1);
}
.cake-thumb-branca { background: linear-gradient(135deg, #FFF9E6, #F3E5AB); border: 3px solid #E6D498; }
.cake-thumb-mista { background: linear-gradient(135deg, #FFF9E6 50%, #7B4A2B 50%); border: 3px solid #A87654; }
.cake-thumb-chocolate { background: linear-gradient(135deg, #7B4A2B, #4A2E1B); border: 3px solid #362012; }
.cake-thumb-baunilha { background: linear-gradient(135deg, #FFFDE8, #EEDC82); border: 3px solid #D4AF37; }
.cake-thumb-amanteigada { background: linear-gradient(135deg, #FFF3CD, #E2B96F); border: 3px solid #C59B27; }
</style>
</head>

<script>
/* ============================================================
   AMBIENTE CONFEITARIA - DeliciArte da Janinha  (v2)
   Three.js r128 + GSAP.
   Salão + mesa retrô + bailarina de cristal + bolo no topo.

   COMO USAR (dentro do initApp, depois de criar scene, camera,
   renderer, controls e cakeGroup, e ANTES do primeiro buildCake()):

     const ambiente = aplicarAmbienteConfeitaria({ scene, renderer, camera, controls, cakeGroup,
       janinhaUrl,   // URL da imagem da Janinha (PNG com fundo transparente)
       balaoEl,      // elemento HTML do balão de fala (posicionado sobre a cabeça dela)
       fallbackEl }); // <img> de reserva, mostrado só se a textura não carregar

   Depois, SEMPRE que o bolo for reconstruído, sincronize:

     function updateCake() { buildCake(); ambiente.sincronizarBolo(); }

   e logo após o primeiro buildCake() da inicialização:

     buildCake();
     ambiente.sincronizarBolo();

   Apague o bloco antigo de luzes/materiais/paredes/piso.
   ============================================================ */

function aplicarAmbienteConfeitaria({ scene, renderer, camera, controls, cakeGroup, janinhaUrl, balaoEl, fallbackEl }) {

  // ---------- 1. RENDERER (principal causa do "estouro" branco) ----------
  renderer.physicallyCorrectLights = false;           // evita luzes absurdamente fortes
  renderer.toneMapping = THREE.ACESFilmicToneMapping; // comprime brancos estourados
  renderer.toneMappingExposure = 0.9;                 // ajuste fino: 0.7 = mais escuro, 1.1 = mais claro
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // ---------- 2. LIMPA CENÁRIO ANTIGO (mantém só o bolo) ----------
  [...scene.children].forEach(obj => {
    if (obj === cakeGroup) return;
    scene.remove(obj);
    obj.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
          if (m.map) m.map.dispose();
          m.dispose();
        });
      }
    });
  });

  // ---------- 3. PALETA ----------
  const P = {
    fundo:       0x2b1a1c,  // fundo escuro, o ambiente "brilha" contra ele
    parede:      0x8a4552,  // bordô rosado médio
    painel:      0x5e2a34,  // lambri inferior mais escuro
    moldura:     0xe5a823,  // dourado da marca
    pisoClaro:   0xe9dcc6,  // mármore creme
    pisoEscuro:  0x6b4630,  // chocolate
    teto:        0x4a2530,
    balcao:      0x3d2314,
    tampo:       0xf3e9dc,
    tapete:      0x7a2e3b,
    luzQuente:   0xffc98a,
    mesaTampo:   0x5cbfb1,  // verde-água (turquesa suavizado p/ combinar com bordô e dourado)
    madeira:     0xd9954a   // madeira clara dos pés
  };

  scene.background = new THREE.Color(P.fundo);
  scene.fog = new THREE.Fog(P.fundo, 16, 34);

  const mat = (color, rough = 0.7, metal = 0, extra = {}) =>
    new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });

  const room = new THREE.Group();
  room.name = 'confeitaria';
  scene.add(room);

  const add = (mesh, x = 0, y = 0, z = 0, shadow = true) => {
    mesh.position.set(x, y, z);
    mesh.castShadow = shadow;
    mesh.receiveShadow = true;
    room.add(mesh);
    return mesh;
  };

  // Dimensões do salão
  const W = 18, D = 14, H = 6.5;
  const backZ = -D / 2 + 1; // parede do fundo

  // ---------- 4. PISO xadrez (contraste forte = profundidade) ----------
  const tile = document.createElement('canvas');
  tile.width = tile.height = 256;
  const tc = tile.getContext('2d');
  tc.fillStyle = '#e9dcc6'; tc.fillRect(0, 0, 256, 256);
  tc.fillStyle = '#6b4630'; tc.fillRect(0, 0, 128, 128); tc.fillRect(128, 128, 128, 128);
  tc.strokeStyle = 'rgba(0,0,0,0.25)'; tc.lineWidth = 3; tc.strokeRect(0, 0, 256, 256);
  const floorTex = new THREE.CanvasTexture(tile);
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
  floorTex.repeat.set(W / 2, D / 2);
  floorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const floor = add(new THREE.Mesh(
    new THREE.PlaneGeometry(W, D),
    mat(0xffffff, 0.35, 0.05, { map: floorTex })
  ), 0, 0, 0, false);
  floor.rotation.x = -Math.PI / 2;

  // Tapete redondo sob o bolo
  const rug = add(new THREE.Mesh(new THREE.CircleGeometry(3.2, 64), mat(P.tapete, 0.95)), 0, 0.01, 0, false);
  rug.rotation.x = -Math.PI / 2;
  const rugRing = add(new THREE.Mesh(new THREE.RingGeometry(3.0, 3.2, 64), mat(P.moldura, 0.4, 0.6)), 0, 0.012, 0, false);
  rugRing.rotation.x = -Math.PI / 2;

  // ---------- 5. PAREDES + LAMBRI + MOLDURAS ----------
  const wallMat = mat(P.parede, 0.85);
  const panelMat = mat(P.painel, 0.75);
  const goldMat = mat(P.moldura, 0.3, 0.7);

  // Fundo
  add(new THREE.Mesh(new THREE.PlaneGeometry(W, H), wallMat), 0, H / 2, backZ, false);
  // Laterais
  const left = add(new THREE.Mesh(new THREE.PlaneGeometry(D, H), wallMat), -W / 2, H / 2, 0, false);
  left.rotation.y = Math.PI / 2;
  const right = add(new THREE.Mesh(new THREE.PlaneGeometry(D, H), wallMat), W / 2, H / 2, 0, false);
  right.rotation.y = -Math.PI / 2;
  // Teto
  const ceil = add(new THREE.Mesh(new THREE.PlaneGeometry(W, D), mat(P.teto, 0.9)), 0, H, 0, false);
  ceil.rotation.x = Math.PI / 2;

  // Lambri (metade inferior da parede do fundo) + friso dourado
  add(new THREE.Mesh(new THREE.BoxGeometry(W, 1.8, 0.12), panelMat), 0, 0.9, backZ + 0.06);
  add(new THREE.Mesh(new THREE.BoxGeometry(W, 0.08, 0.16), goldMat), 0, 1.84, backZ + 0.08);
  // Rodapé dourado
  add(new THREE.Mesh(new THREE.BoxGeometry(W, 0.12, 0.16), goldMat), 0, 0.06, backZ + 0.08);

  // Quadros em moldura dourada (painéis na parede)
  [-5.5, 5.5].forEach(x => {
    add(new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.2, 0.08), goldMat), x, 3.7, backZ + 0.05);
    add(new THREE.Mesh(new THREE.BoxGeometry(2.3, 2.9, 0.1), mat(0xf6e7d2, 0.9)), x, 3.7, backZ + 0.06);
  });

  // Letreiro central com o nome
  const sign = document.createElement('canvas');
  sign.width = 1024; sign.height = 384;
  const sc = sign.getContext('2d');
  const signTex = new THREE.CanvasTexture(sign);
  function desenharLetreiro() {
    sc.fillStyle = '#2b0c0e'; sc.fillRect(0, 0, 1024, 384);
    sc.strokeStyle = '#e5a823'; sc.lineWidth = 14; sc.strokeRect(10, 10, 1004, 364);
    sc.fillStyle = '#e5a823';
    sc.textAlign = 'center'; sc.textBaseline = 'middle';
    sc.font = '150px "Great Vibes", cursive';
    sc.fillText('DeliciArte', 512, 150);
    sc.font = '90px "Great Vibes", cursive';
    sc.fillStyle = '#f5d77f';
    sc.fillText('da Janinha', 512, 270);
    signTex.needsUpdate = true;
  }
  desenharLetreiro();
  // redesenha quando a fonte Great Vibes terminar de carregar
  if (document.fonts && document.fonts.load) {
    document.fonts.load('150px "Great Vibes"').then(desenharLetreiro).catch(() => {});
  }
  add(new THREE.Mesh(
    new THREE.PlaneGeometry(4.2, 1.575),
    new THREE.MeshStandardMaterial({ map: signTex, emissive: 0xffffff, emissiveMap: signTex, emissiveIntensity: 0.35, roughness: 0.6 })
  ), 0, 4.1, backZ + 0.1, false);

  // ---------- 6. BALCÃO DE VITRINE (ao fundo, longe do bolo) ----------
  const counterZ = backZ + 1.4;
  add(new THREE.Mesh(new THREE.BoxGeometry(10, 1.1, 1.4), mat(P.balcao, 0.55)), 0, 0.55, counterZ);
  add(new THREE.Mesh(new THREE.BoxGeometry(10.3, 0.12, 1.7), mat(P.tampo, 0.25, 0.05)), 0, 1.16, counterZ);
  add(new THREE.Mesh(new THREE.BoxGeometry(10.1, 0.06, 1.5), goldMat), 0, 0.06, counterZ);

  // Domos de vidro com doces sobre o balcão
  const glass = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.22
  });
  const doces = [0xd95d7a, 0xf2c14e, 0x8a4b2a, 0xf7f0e6, 0xb5445a];
  for (let i = 0; i < 5; i++) {
    const x = -4 + i * 2;
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.06, 32), goldMat), x, 1.25, counterZ, false);
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.22, 24), mat(doces[i], 0.5)), x, 1.38, counterZ);
    add(new THREE.Mesh(new THREE.SphereGeometry(0.46, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), glass), x, 1.28, counterZ, false);
  }

  // ---------- 7. PRATELEIRAS COM POTES ----------
  [2.4, 3.1].forEach(y => {
    [-8.4, 8.4].forEach(x => {
      add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 4), mat(P.balcao, 0.6)), x, y, -1);
      for (let k = 0; k < 5; k++) {
        const jar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.14, 0.14, 0.32, 16),
          mat(doces[(k + (y > 2.5 ? 2 : 0)) % 5], 0.4, 0.05)
        );
        add(jar, x, y + 0.2, -2.6 + k * 0.85);
      }
    });
  });

  // ---------- 8. LUSTRES PENDENTES ----------
  const lampPositions = [[-5.5, -1], [0, 1.5], [5.5, -1]];
  lampPositions.forEach(([x, z]) => {
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1.6, 8), goldMat), x, H - 0.8, z, false);
    add(new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.4, 24, 1, true), mat(P.moldura, 0.3, 0.7, { side: THREE.DoubleSide })), x, H - 1.7, z, false);
    add(new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 12), new THREE.MeshBasicMaterial({ color: P.luzQuente })), x, H - 1.75, z, false);

    const pl = new THREE.PointLight(P.luzQuente, 0.55, 14, 2);
    pl.position.set(x, H - 1.9, z);
    room.add(pl);
  });

  // ---------- 9. ILUMINAÇÃO EQUILIBRADA ----------
  // Luz de preenchimento céu/chão: dá cor às sombras sem estourar
  room.add(new THREE.HemisphereLight(0xffe3c8, 0x3a2024, 0.6));

  // Luz principal quente com sombras suaves
  const key = new THREE.DirectionalLight(0xfff0dc, 0.65);
  key.position.set(5, 11, 7);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -10; key.shadow.camera.right = 10;
  key.shadow.camera.top = 10;   key.shadow.camera.bottom = -10;
  key.shadow.camera.near = 1;   key.shadow.camera.far = 30;
  key.shadow.bias = -0.0005;
  room.add(key);

  // Spot dourado destacando o bolo (ele é a estrela da cena)
  const spot = new THREE.SpotLight(0xffd9a0, 0.9, 20, Math.PI / 6, 0.5, 1.5);
  spot.position.set(0, 7, 2.5);
  spot.target.position.set(0, 2.0, 0);
  spot.castShadow = true;
  spot.shadow.mapSize.set(1024, 1024);
  room.add(spot);
  room.add(spot.target);

  // Contraluz rosada para recortar o bolo do fundo
  const rim = new THREE.DirectionalLight(0xff9db0, 0.25);
  rim.position.set(-6, 5, -6);
  room.add(rim);

  let giro = 0; // rotação atual do bolo (só ele gira)

  // ---------- 10. MESA RETRÔ (tampo verde-água + pés de madeira abertos) ----------
  const MESA = { hx: 2.3, hz: 1.8, topY: 1.15 };

  function retanguloArredondado(w, h, r) {
    const sh = new THREE.Shape();
    const x = -w / 2, y = -h / 2;
    sh.moveTo(x + r, y);
    sh.lineTo(x + w - r, y);     sh.quadraticCurveTo(x + w, y, x + w, y + r);
    sh.lineTo(x + w, y + h - r); sh.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    sh.lineTo(x + r, y + h);     sh.quadraticCurveTo(x, y + h, x, y + h - r);
    sh.lineTo(x, y + r);         sh.quadraticCurveTo(x, y, x + r, y);
    return sh;
  }

  const mesaGroup = new THREE.Group();
  mesaGroup.name = 'mesa';
  room.add(mesaGroup);

  const tampoGeo = new THREE.ExtrudeGeometry(
    retanguloArredondado(MESA.hx * 2 - 0.06, MESA.hz * 2 - 0.06, 0.5),
    { depth: 0.06, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 4, curveSegments: 20 }
  );
  const tampo = new THREE.Mesh(tampoGeo, new THREE.MeshPhysicalMaterial({
    color: P.mesaTampo, roughness: 0.22, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.12
  }));
  tampo.rotation.x = -Math.PI / 2;
  tampo.position.y = MESA.topY - 0.09; // face de cima exatamente em topY
  tampo.castShadow = true; tampo.receiveShadow = true;
  mesaGroup.add(tampo);

  const madeira = mat(P.madeira, 0.5, 0.0);
  // Travessa (moldura de madeira sob o tampo)
  const travessa = new THREE.Mesh(new THREE.BoxGeometry(MESA.hx * 2 - 1.0, 0.12, MESA.hz * 2 - 0.9), madeira);
  travessa.position.y = 0.96;
  travessa.castShadow = true; travessa.receiveShadow = true;
  mesaGroup.add(travessa);

  // Pés cônicos inclinados para fora
  const legH = 1.0, tilt = 0.14;
  const legGeo = new THREE.CylinderGeometry(0.065, 0.04, legH, 20);
  [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(([sx, sz]) => {
    const leg = new THREE.Mesh(legGeo, madeira);
    const topX = MESA.hx - 0.5, topZ = MESA.hz - 0.45;
    const shift = Math.sin(tilt) * legH / 2;
    leg.position.set(sx * (topX + shift), 0.02 + legH / 2, sz * (topZ + shift));
    leg.rotation.z = sx * tilt;     // base afasta para fora em X
    leg.rotation.x = -sz * tilt;    // base afasta para fora em Z
    leg.castShadow = true; leg.receiveShadow = true;
    mesaGroup.add(leg);
  });

  // ---------- 11. BAILARINA (prato de cristal + haste facetada cromada) ----------
  function criarEnvCromo() {
    const grad = (stops) => {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 0, 128);
      stops.forEach(([o, col]) => gr.addColorStop(o, col));
      g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
      return { c, g };
    };
    const lat = grad([[0, '#ffe9c8'], [0.45, '#b86b5a'], [0.55, '#4a2530'], [1, '#2b1a1c']]);
    lat.g.fillStyle = 'rgba(255,255,255,0.95)';       // "softbox" para brilho no cromo
    lat.g.fillRect(22, 18, 34, 52);
    lat.g.fillStyle = 'rgba(229,168,35,0.85)';
    lat.g.fillRect(84, 30, 14, 60);
    const topo = grad([[0, '#fff3dc'], [1, '#ffd9a0']]);
    const chao = grad([[0, '#6b4630'], [1, '#2b1a1c']]);
    const tex = new THREE.CubeTexture([lat.c, lat.c, topo.c, chao.c, lat.c, lat.c]);
    tex.needsUpdate = true;
    return tex;
  }
  const envCromo = criarEnvCromo();

  const STAND = { plateY: 0.6 }; // altura da face de cima do prato sobre o tampo
  const standGroup = new THREE.Group();
  standGroup.name = 'bailarina';
  standGroup.position.set(0, MESA.topY, 0);
  room.add(standGroup);

  const cromo = new THREE.MeshStandardMaterial({ color: 0xdfe3e8, metalness: 1, roughness: 0.12, envMap: envCromo });
  const cristal = new THREE.MeshPhysicalMaterial({
    color: 0xeaf6ff, metalness: 0, roughness: 0.04, transparent: true, opacity: 0.4,
    clearcoat: 1, envMap: envCromo, envMapIntensity: 1.2, side: THREE.DoubleSide, depthWrite: false
  });
  const cristalLapidado = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, metalness: 0, roughness: 0.05, transparent: true, opacity: 0.65,
    envMap: envCromo, envMapIntensity: 1.4, depthWrite: false
  });

  const parte = (geo, material, y, sombra = true) => {
    const m = new THREE.Mesh(geo, material);
    m.position.y = y;
    m.castShadow = sombra; m.receiveShadow = true;
    standGroup.add(m);
    return m;
  };
  // Base octogonal em degraus, haste facetada e nó
  parte(new THREE.CylinderGeometry(0.30, 0.36, 0.10, 8), cromo, 0.05);
  parte(new THREE.CylinderGeometry(0.20, 0.26, 0.06, 8), cromo, 0.13);
  parte(new THREE.CylinderGeometry(0.09, 0.14, 0.28, 8), cromo, 0.30);
  parte(new THREE.SphereGeometry(0.10, 20, 14), cromo, 0.50);
  parte(new THREE.CylinderGeometry(0.06, 0.09, 0.06, 8), cromo, 0.57);

  // Prato: reconstruído a cada mudança de tamanho do bolo
  const tickGeo = new THREE.BoxGeometry(0.14, 0.03, 0.012);
  let prato = null;
  function construirPrato(r) {
    if (prato) {
      standGroup.remove(prato);
      prato.traverse(o => { if (o.geometry && o.geometry !== tickGeo) o.geometry.dispose(); });
    }
    prato = new THREE.Group();
    prato.position.y = STAND.plateY;
    prato.rotation.y = giro;

    const perfil = [
      [0, 0], [r * 0.5, 0.002], [r * 0.9, 0.02], [r, 0.065], [r + 0.015, 0.085],
      [r + 0.015, 0.07], [r, 0.05], [r * 0.9, 0.0], [r * 0.5, -0.03], [0, -0.03]
    ].map(([x, y]) => new THREE.Vector2(x, y));
    const disco = new THREE.Mesh(new THREE.LatheGeometry(perfil, 72), cristal);
    disco.receiveShadow = true;
    prato.add(disco);

    // Lapidação da borda (riscos radiais)
    const n = Math.max(36, Math.round(r * 40));
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const t = new THREE.Mesh(tickGeo, cristalLapidado);
      const rr = r * 0.86;
      t.position.set(Math.cos(a) * rr, 0.03, Math.sin(a) * rr);
      t.rotation.y = -a;
      prato.add(t);
    }
    standGroup.add(prato);
  }
  construirPrato(1.0);

  // ---------- 12. BOLO SOBRE A BAILARINA ----------
  const _box = new THREE.Box3();
  const _size = new THREE.Vector3();

  function sincronizarBolo() {
    if (!cakeGroup) return;
    // mede o bolo "limpo" (sem escala nem deslocamento)
    cakeGroup.scale.setScalar(1);
    cakeGroup.rotation.y = 0;
    cakeGroup.position.y = 0;
    cakeGroup.updateMatrixWorld(true);
    _box.setFromObject(cakeGroup);
    if (_box.isEmpty()) return;
    _box.getSize(_size);

    let cakeR = Math.max(_size.x, _size.z) / 2;
    const maxPrato = MESA.hz - 0.2;      // prato nunca passa do tampo
    const maxBolo = maxPrato - 0.15;
    let escala = 1;
    if (cakeR > maxBolo) { escala = maxBolo / cakeR; cakeR = maxBolo; } // bolo muito grande: reduz p/ caber
    const pratoR = Math.min(Math.max(cakeR + 0.2, 0.85), maxPrato);
    construirPrato(pratoR);

    cakeGroup.scale.setScalar(escala);
    cakeGroup.updateMatrixWorld(true);
    _box.setFromObject(cakeGroup);
    const baseY = MESA.topY + STAND.plateY + 0.005;
    cakeGroup.position.y = baseY - _box.min.y;
    cakeGroup.updateMatrixWorld(true);
    _box.setFromObject(cakeGroup);
    cakeGroup.rotation.y = giro; // devolve o giro atual

    // câmera passa a orbitar o centro do bolo
    if (controls) {
      const alvoY = Math.min(2.6, Math.max(1.9, (baseY + _box.max.y) / 2));
      if (window.gsap) {
        gsap.to(controls.target, { y: alvoY, duration: 0.5, ease: 'power2.out', onUpdate: () => controls.update() });
      } else {
        controls.target.y = alvoY;
        controls.update();
      }
    }
  }

  // ---------- 12b. GIRO SÓ DO BOLO (câmera, salão e Janinha ficam parados) ----------
  const girar = (da) => {
    giro += da;
    cakeGroup.rotation.y = giro;
    if (prato) prato.rotation.y = giro;
  };
  let velocidade = 0, arrastando = false, ultimoX = 0;
  const dedos = new Set();
  const alvoToque = renderer.domElement;
  if (alvoToque) {
    alvoToque.addEventListener('pointerdown', (e) => {
      dedos.add(e.pointerId);
      arrastando = dedos.size === 1;   // com 2 dedos (pinça/zoom) não gira
      velocidade = 0;
      ultimoX = e.clientX;
    });
    alvoToque.addEventListener('pointermove', (e) => {
      if (!arrastando || !dedos.has(e.pointerId)) return;
      const dx = e.clientX - ultimoX;
      ultimoX = e.clientX;
      const da = (dx / (alvoToque.clientWidth || 1)) * Math.PI * 2.2; // arrastar a tela toda ≈ 1,1 volta
      girar(da);
      velocidade = da;
    });
    const soltar = (e) => { dedos.delete(e.pointerId); if (dedos.size === 0) arrastando = false; };
    alvoToque.addEventListener('pointerup', soltar);
    alvoToque.addEventListener('pointercancel', soltar);
  }

  // loop leve: inércia do giro
  function tick() {
    requestAnimationFrame(tick);
    if (!arrastando && Math.abs(velocidade) > 0.00005) { girar(velocidade); velocidade *= 0.93; }
    else if (!arrastando) velocidade = 0;
  }
  if (typeof requestAnimationFrame === 'function') tick();

  // ---------- 13. CÂMERA/CONTROLES: gira só ao redor e por cima ----------
  if (camera) camera.position.set(0, 3.6, 5.4);
  if (controls) {
    controls.target.set(0, 2.0, 0);
    controls.enablePan = false;                  // mantém o bolo sempre centralizado
    controls.minAzimuthAngle = 0;                // câmera NÃO gira ao redor: quem gira é o bolo
    controls.maxAzimuthAngle = 0;
    controls.enableDamping = true;
    controls.minDistance = 3.2;
    controls.maxDistance = 6.2;                  // câmera sempre dentro do salão
    controls.minPolarAngle = 0.85;               // limite de cima (não passa do teto)
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // NUNCA desce abaixo do nível do bolo
    controls.update();
  }

  return { room, sincronizarBolo, getGiro: () => giro };
}


function initApp() {
  console.log('🎂 Iniciando DeliciArte 3D...');

  if (typeof THREE === 'undefined') {
    console.error('❌ Three.js não carregou');
    const loader = document.getElementById('loader');
    if (loader) loader.innerHTML = '<div class="text-red-600 font-bold">Erro: Three.js não carregou. Recarregue a página.</div>';
    return;
  }

  const state = {
    massa: 'branca',
    tamanho: 1,
    recheio1: 'none',
    recheio2: 'none',
    cobertura: 'none',
    decoracao: 'none'
  };

  const container = document.getElementById('canvas-container');
  const loader = document.getElementById('loader');
  const hint = document.getElementById('hint');

  if (!container) {
    console.error('❌ Container 3D não encontrado');
    return;
  }

  const width = container.clientWidth || (window.innerWidth * 0.66);
  const height = container.clientHeight || window.innerHeight;

  try {
    // Fundo, névoa, luzes e cenário são montados por aplicarAmbienteConfeitaria()
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
    camera.position.set(0, 3.6, 5.4);

    // Em telas estreitas (celular) abre o campo de visão para o bolo caber inteiro
    const ajustarFov = () => {
      camera.fov = camera.aspect < 1 ? 55 : 40;
      camera.updateProjectionMatrix();
    };
    ajustarFov();

    // --- CRIAÇÃO ULTRA DEFENSIVA DE RENDERER WEBGL PARA DISPOSITIVOS MÓVEIS ---
    let renderer = null;
    let canvas = document.createElement('canvas');

    const tryCreateRenderer = () => {
      const optionsList = [
        { antialias: true, alpha: false, powerPreference: 'high-performance' },
        { antialias: false, alpha: false, powerPreference: 'default' },
        { antialias: false, alpha: false, powerPreference: 'low-power', precision: 'mediump' }
      ];

      for (let opts of optionsList) {
        try {
          const r = new THREE.WebGLRenderer({ canvas: canvas, ...opts });
          if (r) return r;
        } catch (e) {
          console.warn('Tentando próximo perfil WebGL...', e);
        }
      }
      return null;
    };

    renderer = tryCreateRenderer();

    if (!renderer) {
      throw new Error('WebGL desabilitado ou não suportado neste navegador.');
    }

    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    
    // Desativa sombras pesadas em placas de menor desempenho para evitar crash de GPU
    try {
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    } catch(e) {
      renderer.shadowMap.enabled = false;
    }

    container.appendChild(renderer.domElement);

    // Listener para auto-recuperar se a GPU reiniciar
    canvas.addEventListener('webglcontextlost', (event) => {
      event.preventDefault();
      console.warn('⚠️ Contexto WebGL perdido. Aguardando restauração...');
    }, false);

    canvas.addEventListener('webglcontextrestored', () => {
      console.log('🔄 Contexto WebGL restaurado!');
      updateCake();
    }, false);

    console.log('✅ Renderer WebGL instanciado com sucesso!');

    let controls = null;
    if (typeof THREE.OrbitControls !== 'undefined') {
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.dampingFactor = 0.05;
      // limites de zoom, ângulo e alvo são definidos por aplicarAmbienteConfeitaria()
    }

    // Grupo do Bolo
    const cakeGroup = new THREE.Group();
    scene.add(cakeGroup);

    // === AMBIENTE: salão + mesa retrô + bailarina de cristal + iluminação ===
    const ambiente = aplicarAmbienteConfeitaria({
      scene, renderer, camera, controls, cakeGroup
    });

    // Animação GSAP de entrada: a câmera desce suavemente até a posição final
    if (typeof gsap !== 'undefined' && controls) {
      const maxDistFinal = controls.maxDistance;
      controls.maxDistance = 9; // folga só durante a animação
      gsap.from(camera.position, {
        y: 5.4,
        z: 7.4,
        duration: 2.2,
        ease: 'power2.out',
        onComplete: () => { controls.maxDistance = maxDistFinal; }
      });
    }

    // Materiais
    const massColors = {
      branca: 0xFFF9E6,
      mista: 0xD2B48C,
      chocolate: 0x5C3A21,
      baunilha: 0xFFFDE8,
      amanteigada: 0xFFF3CD
    };

    const fillingColors = {
      none: 0xFFFFFF,
      brigadeiro: 0x3D2314,
      brigadeiro_branco: 0xFFFBE6,
      doce_de_leite: 0xC68B59,
      beijinho: 0xFFFDF0,
      morango: 0xE63946,
      chocolate_amargo: 0x2B1810,
      ganache: 0x4A2E1B,
      ninho: 0xFFFEEA,
      limao: 0xE2F1AF,
      maracuja: 0xFFD166,
      ninho_morango: 0xF4A261,
      ninho_nutella: 0x582F0E,
      brigadeiro_morango: 0x7B2CBF
    };

    const frostingColors = {
      chantininho: 0xFFFFFF,
      chocolate: 0x4A2E1B,
      brigadeiro: 0x362012,
      ganache: 0x2B1810
    };

    let topperMesh = null;

    function buildCake() {
      // Limpar bolo anterior
      while(cakeGroup.children.length > 0) {
        const obj = cakeGroup.children[0];
        cakeGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
      }

      const numFillings = state.tamanho >= 3 ? 2 : 1;
      const baseRadius = 0.9 + Math.min(state.tamanho * 0.05, 0.4);
      const layerHeight = 0.22;

      let layerCount = 3;
      let curY = 0.08 + layerHeight / 2;

      // Se houver cobertura completa
      if (state.cobertura !== 'none') {
        const totalHeight = layerCount * layerHeight + (numFillings * 0.08);
        const coverGeo = new THREE.CylinderGeometry(baseRadius + 0.03, baseRadius + 0.03, totalHeight, 64);
        const coverMat = new THREE.MeshStandardMaterial({
          color: frostingColors[state.cobertura] || 0xFFFFFF,
          roughness: 0.3,
          metalness: 0.05
        });
        const coverMesh = new THREE.Mesh(coverGeo, coverMat);
        coverMesh.position.y = 0.08 + totalHeight / 2;
        coverMesh.castShadow = true;
        coverMesh.receiveShadow = true;
        cakeGroup.add(coverMesh);
      } else {
        // Bolo sem cobertura (Naked Cake com Camadas Visíveis)
        for (let i = 0; i < layerCount; i++) {
          const massaGeo = new THREE.CylinderGeometry(baseRadius, baseRadius, layerHeight, 48);
          const massaMat = new THREE.MeshStandardMaterial({
            color: massColors[state.massa] || 0xFFF9E6,
            roughness: 0.7
          });
          const massaMesh = new THREE.Mesh(massaGeo, massaMat);
          massaMesh.position.y = curY;
          massaMesh.castShadow = true;
          massaMesh.receiveShadow = true;
          cakeGroup.add(massaMesh);

          curY += layerHeight;

          // Adicionar Recheio entre camadas
          if (i < layerCount - 1) {
            const currentFillingKey = (i === 0) ? state.recheio1 : (numFillings > 1 ? state.recheio2 : state.recheio1);
            if (currentFillingKey !== 'none') {
              const fillGeo = new THREE.CylinderGeometry(baseRadius - 0.02, baseRadius - 0.02, 0.08, 48);
              const fillMat = new THREE.MeshStandardMaterial({
                color: fillingColors[currentFillingKey] || 0xFFFFFF,
                roughness: 0.4
              });
              const fillMesh = new THREE.Mesh(fillGeo, fillMat);
              fillMesh.position.y = curY - (layerHeight / 2) + 0.04;
              cakeGroup.add(fillMesh);
              curY += 0.06;
            }
          }
        }
      }

      // Decoração Superior
      const topY = 0.08 + (layerCount * layerHeight) + 0.02;

      if (state.decoracao === 'morango') {
        const strawberryGeo = new THREE.ConeGeometry(0.08, 0.16, 12);
        const strawberryMat = new THREE.MeshStandardMaterial({ color: 0xE63946, roughness: 0.3 });
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
          const sMesh = new THREE.Mesh(strawberryGeo, strawberryMat);
          sMesh.position.set(Math.cos(a) * (baseRadius * 0.6), topY + 0.08, Math.sin(a) * (baseRadius * 0.6));
          sMesh.rotation.z = Math.PI;
          cakeGroup.add(sMesh);
        }
      }

      // Topper de Bolo com Texto/Tema Personalizado
      if (topperMesh) cakeGroup.add(topperMesh);
    }

    function createTopperMesh(text) {
      const group = new THREE.Group();
      
      // Haste Dourada
      const stickGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.9, 16);
      const stickMat = new THREE.MeshStandardMaterial({ color: 0xE5A823, metalness: 0.8, roughness: 0.2 });
      const stick = new THREE.Mesh(stickGeo, stickMat);
      stick.position.y = 0.45;
      group.add(stick);

      // Placa com Texto
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#2B0C0E';
      ctx.fillRect(0, 0, 512, 256);
      ctx.strokeStyle = '#E5A823';
      ctx.lineWidth = 12;
      ctx.strokeRect(6, 6, 500, 244);

      ctx.fillStyle = '#E5A823';
      ctx.font = 'bold 44px Montserrat, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text || 'DeliciArte', 256, 128);

      const texture = new THREE.CanvasTexture(canvas);
      const boardGeo = new THREE.PlaneGeometry(0.7, 0.35);
      const boardMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
      const board = new THREE.Mesh(boardGeo, boardMat);
      board.position.y = 0.8;
      group.add(board);

      const topY = 0.08 + (3 * 0.22);
      group.position.y = topY;
      return group;
    }

    // Reconstrói o bolo e reposiciona sobre a bailarina (prato acompanha o tamanho)
    function updateCake() {
      buildCake();
      ambiente.sincronizarBolo();
    }

    // Ligação tolerante: se o elemento foi removido do HTML, simplesmente ignora
    const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };

    // Eventos dos Controles
    on('sizeInput', 'input', (e) => {
      let val = parseFloat(e.target.value) || 1;
      state.tamanho = val;
      const badge = document.getElementById('recheioBadge');
      const singleContainer = document.getElementById('singleFillingContainer');
      const doubleContainer = document.getElementById('doubleFillingContainer');

      if (val >= 3) {
        if (badge) badge.innerText = '2 Recheios';
        if (singleContainer) singleContainer.classList.add('hidden');
        if (doubleContainer) doubleContainer.classList.remove('hidden');
      } else {
        if (badge) badge.innerText = '1 Recheio';
        if (singleContainer) singleContainer.classList.remove('hidden');
        if (doubleContainer) doubleContainer.classList.add('hidden');
      }
      updateCake();
    });

    ['branca', 'mista', 'chocolate', 'baunilha', 'amanteigada'].forEach(massa => {
      const btn = document.getElementById(`btn-massa-${massa}`);
      if (btn) {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[id^="btn-massa-"]').forEach(b => b.classList.remove('btn-active'));
          btn.classList.add('btn-active');
          state.massa = massa;
          updateCake();
        });
      }
    });

    on('singleRecheioSelect', 'change', (e) => {
      state.recheio1 = e.target.value;
      updateCake();
    });

    on('selectRecheio1', 'change', (e) => {
      state.recheio1 = e.target.value;
      updateCake();
    });

    on('selectRecheio2', 'change', (e) => {
      state.recheio2 = e.target.value;
      updateCake();
    });

    on('coberturaSelect', 'change', (e) => {
      state.cobertura = e.target.value;
      updateCake();
    });

    on('decoracaoSelect', 'change', (e) => {
      state.decoracao = e.target.value;
      updateCake();
    });

    on('btnGerarTopper', 'click', () => {
      const val = (document.getElementById('inputTemaTopper')?.value || '').trim();
      if (val) {
        topperMesh = createTopperMesh(val);
      } else {
        topperMesh = null;
      }
      updateCake();
    });

    // Modal de Finalização e WhatsApp
    const orderModal = document.getElementById('orderModal');
    const stepSummary = document.getElementById('orderStepSummary');
    const stepForm = document.getElementById('orderStepForm');

    on('btn-finalizar', 'click', () => {
      let recheioTxt = state.tamanho >= 3 ? `${state.recheio1} & ${state.recheio2}` : state.recheio1;
      const html = `
        <p><strong>⚖️ Tamanho:</strong> ${state.tamanho} kg</p>
        <p><strong>🧁 Massa:</strong> ${state.massa.toUpperCase()}</p>
        <p><strong>🍫 Recheio:</strong> ${recheioTxt}</p>
        <p><strong>✨ Cobertura:</strong> ${state.cobertura}</p>
        ${document.getElementById('decoracaoSelect') ? `<p><strong>🎨 Decoração:</strong> ${state.decoracao}</p>` : ''}
      `;
      document.getElementById('modalSummaryText').innerHTML = html;
      stepSummary.classList.remove('hidden');
      stepForm.classList.add('hidden');
      orderModal.classList.remove('opacity-0', 'pointer-events-none');
    });

    on('btn-close-modal', 'click', () => {
      orderModal.classList.add('opacity-0', 'pointer-events-none');
    });

    on('btn-confirm-order', 'click', () => {
      stepSummary.classList.add('hidden');
      stepForm.classList.remove('hidden');
    });

    on('btn-back-to-summary', 'click', () => {
      stepForm.classList.add('hidden');
      stepSummary.classList.remove('hidden');
    });

    on('deliveryForm', 'submit', (e) => {
      e.preventDefault();
      
      const name = document.getElementById('custName').value.trim();
      const phoneInput = document.getElementById('custPhone').value.trim();
      const dateVal = document.getElementById('deliveryDate').value;
      const timeVal = document.getElementById('deliveryTime').value;
      const address = document.getElementById('custAddress').value.trim();

      let formattedDate = dateVal;
      if (dateVal.includes('-')) {
        const parts = dateVal.split('-');
        formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
      }

      let cleanDigits = phoneInput.replace(/\D/g, '');
      if (cleanDigits.length === 10 || cleanDigits.length === 11) {
        cleanDigits = '55' + cleanDigits;
      }
      const targetPhone = cleanDigits.length >= 12 ? cleanDigits : '5583988558021';

      let recheioTxt = state.tamanho >= 3 ? `${state.recheio1} & ${state.recheio2}` : state.recheio1;
      const topperTema = (document.getElementById('inputTemaTopper')?.value || '').trim() || 'Nenhum';

      const temDecoracao = !!document.getElementById('decoracaoSelect');
      const temTopper = !!document.getElementById('inputTemaTopper');
      const extraDecoracao = (temDecoracao ? `\n🎨 Decoração: ${state.decoracao}` : '') + (temTopper ? `\n🏷️ Tema Topo: ${topperTema}` : '');

      const messageText = 
`🎂 NOVO PEDIDO - DELICIARTE DA JANINHA

👤 CLIENTE: ${name}
📞 CONTATO: ${phoneInput}
📅 DATA DE ENTREGA: ${formattedDate}
⏰ HORÁRIO: ${timeVal}
📍 ENDEREÇO/RETIRADA: ${address}

--- DETALHES DO BOLO ---
⚖️ Tamanho: ${state.tamanho} kg
🧁 Massa: ${state.massa.toUpperCase()}
🍫 Recheio(s): ${recheioTxt}
✨ Cobertura: ${state.cobertura}${extraDecoracao}`;

      const whatsappUrl = `https://wa.me/${targetPhone}?text=${encodeURIComponent(messageText)}`;
      window.location.href = whatsappUrl;
    });

    // Render loop
    buildCake();
    ambiente.sincronizarBolo(); // coloca o bolo sobre a bailarina na primeira carga
    if (loader) loader.style.opacity = '0';
    setTimeout(() => { if (loader) loader.style.display = 'none'; }, 500);
    if (hint) {
      hint.classList.remove('opacity-0');
      setTimeout(() => hint.classList.add('opacity-0'), 4000);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      ajustarFov();
      renderer.setSize(w, h);
    });

  } catch (err) {
    console.error('❌ Erro na inicialização 3D:', err);
    if (loader) {
      loader.innerHTML = `
        <div class="p-4 bg-amber-50 rounded-2xl border border-amber-300 text-center max-w-xs mx-auto">
          <div class="text-3xl mb-2">🍰</div>
          <h4 class="font-bold text-sm text-[#2b0c0e] mb-1">Modo de Compatibilidade</h4>
          <p class="text-xs text-gray-600 mb-3">Seu navegador restringiu a aceleração WebGL 3D, mas você ainda pode personalizar seu pedido!</p>
          <button onclick="location.reload()" class="px-4 py-2 bg-[#2b0c0e] text-[#e5a823] text-xs font-bold rounded-xl shadow">Tentar Novamente</button>
        </div>
      `;
    }
  }
}

window.onload = function() {
  initApp();
};
</script>
</body>
</html>
